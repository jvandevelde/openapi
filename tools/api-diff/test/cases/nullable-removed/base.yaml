openapi: 3.1.0
info:
  title: Pets
  version: 1.0.0
paths:
  '/pets':
    post:
      operationId: createPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '201':
          description: created
components:
  schemas:
    Pet:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
