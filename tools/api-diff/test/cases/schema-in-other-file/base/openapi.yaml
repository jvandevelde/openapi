openapi: 3.1.0
info:
  title: Pets
  version: 1.0.0
paths:
  '/pets':
    get:
      operationId: listPets
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: &id001
                $ref: schemas.yaml#/Pet
    post:
      operationId: createPet
      requestBody:
        content:
          application/json:
            schema: *id001
      responses:
        '201':
          description: created
