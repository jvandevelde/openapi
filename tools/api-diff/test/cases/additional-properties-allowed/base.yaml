openapi: 3.1.0
info:
  title: Pets
  version: 1.0.0
paths:
  '/pets':
    get:
      operationId: getPet
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
components:
  schemas:
    Pet:
      type: object
      properties:
        name:
          type: string
      additionalProperties: false
