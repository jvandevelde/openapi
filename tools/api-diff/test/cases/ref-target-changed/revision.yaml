openapi: 3.1.0
info:
  title: Pets
  version: 1.0.0
paths:
  '/pets':
    get:
      operationId: listPets
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet2'
    post:
      operationId: createPet
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '201':
          description: created
components:
  schemas:
    Pet:
      type: object
      required:
      - id
      properties:
        id:
          type: string
        name:
          type: string
    Pet2:
      type: object
      required:
      - id
      properties:
        id:
          type: string
        name:
          type: string
