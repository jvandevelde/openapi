openapi: 3.1.0
info: { title: Library, version: 1.0.0 }
paths:
  /authors/{id}:
    get:
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Author' } } } }
components:
  schemas:
    Author:
      type: object
      properties:
        name: { type: string }
        books: { type: array, items: { $ref: '#/components/schemas/Book' } }
    Book:
      type: object
      properties:
        title: { type: string }
        author: { $ref: '#/components/schemas/Author' }
