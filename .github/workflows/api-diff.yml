# One workflow per tool. It runs only when that tool (or this file) changes and
# sets up only the toolchain that tool needs.
name: api-diff

on:
  push:
    branches: [main]
    paths:
      - 'tools/api-diff/**'
      - '.github/workflows/api-diff.yml'
  pull_request:
    paths:
      - 'tools/api-diff/**'
      - '.github/workflows/api-diff.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/api-diff
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: tools/api-diff/package-lock.json
      - run: make test

  bench:
    # Reports parse and compare times for two 8 MB specs. Informational only.
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: tools/api-diff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/api-diff/package-lock.json
      - run: make bench

  self-check:
    # Runs api-diff on the example spec the way an API repo would (see
    # tools/api-diff/docs/ci.md): compares it with the base branch, posts the
    # review report as a PR comment (updated on every push) and keeps the
    # reports as artifacts. It reports changes; it doesn't fail on them.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: tools/api-diff
    env:
      SPEC: examples/petstore/openapi.yaml
      BASE: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the base branch's commits must be present
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/api-diff/package-lock.json
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/api-diff-cache
          key: api-diff-parse-${{ github.event.pull_request.base.sha }}
          restore-keys: api-diff-parse-
      - name: Compare the example spec with the base branch
        id: diff
        run: |
          if ! git cat-file -e "origin/$BASE:tools/api-diff/$SPEC" 2>/dev/null; then
            echo "The base branch has no $SPEC yet; nothing to compare."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p out
          node bin/api-diff.ts -C "$(dirname "$SPEC")" --base "origin/$BASE..." "$(basename "$SPEC")" \
            --cache-dir "$RUNNER_TEMP/api-diff-cache" \
            --report ci \
            --report "review:txt:$PWD/out/review.txt" \
            --report "review:html:$PWD/out/review.html" \
            --report "review:json:$PWD/out/result.json" \
            --report "summary:json:$PWD/out/summary.json" \
            --report "changelog:html:$PWD/out/changelog.html" \
            --report "explore:html:$PWD/out/explore.html"
      - uses: actions/upload-artifact@v4
        if: steps.diff.outputs.skip != 'true'
        with:
          name: api-diff-reports
          path: tools/api-diff/out/
      - name: Post the review report on the pull request
        if: steps.diff.outputs.skip != 'true'
        run: node ci/github-comment.ts --file out/review.txt --key "tools/api-diff/$SPEC"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
