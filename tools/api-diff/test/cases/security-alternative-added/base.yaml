openapi: 3.1.0
info:
  title: Pets
  version: 1.0.0
paths:
  '/pets':
    get:
      operationId: listPets
      security:
      - apiKey: []
      responses:
        '200':
          description: ok
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
    oauth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.example.com/token
          scopes:
            read: r
            write: w
