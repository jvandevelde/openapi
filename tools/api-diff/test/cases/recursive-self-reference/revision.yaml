openapi: 3.1.0
info:
  title: Pets
  version: 1.0.0
paths:
  '/tree':
    get:
      operationId: getTree
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TreeNode'
components:
  schemas:
    TreeNode:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        children:
          type: array
          items:
            $ref: '#/components/schemas/TreeNode'
