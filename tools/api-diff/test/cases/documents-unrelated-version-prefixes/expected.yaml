description: >-
  Several different prefixes, each with its own version segment (v1 → v2, 2024-01-01 → 2025-06-01), no operationIds or
  schemas and a new title. Version segments are dropped anywhere in the path, so the operations still match and the
  documents count as related; the diff reports the moved operations as usual.
