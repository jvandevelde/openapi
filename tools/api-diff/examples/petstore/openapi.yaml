# Example API for the api-diff self-check (.github/workflows/api-diff.yml).
# Change it in a PR to see the review comment api-diff posts.
openapi: 3.1.0
info:
  title: Pet Store
  version: 1.0.0
  description: A small API that api-diff compares against the base branch on every PR.
servers:
  - url: https://api.example.com/v1
paths:
  /pets:
    get:
      operationId: listPets
      tags: [pets]
      summary: List pets
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/PetStatus' }
      responses:
        '200':
          description: The pets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Pet' }
    post:
      operationId: createPet
      tags: [pets]
      summary: Add a pet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewPet' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getPet
      tags: [pets]
      responses:
        '200':
          description: The pet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
        '404':
          description: Not found
    delete:
      operationId: deletePet
      tags: [pets]
      x-stability-level: beta
      responses:
        '204':
          description: Deleted
  /internal/stats:
    get:
      operationId: getStats
      tags: [internal]
      x-internal: true
      responses:
        '200':
          description: Usage numbers
          content:
            application/json:
              schema:
                type: object
                properties:
                  pets: { type: integer }
components:
  schemas:
    PetStatus:
      type: string
      enum: [available, pending, sold]
    NewPet:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
        tag: { type: string }
        status: { $ref: '#/components/schemas/PetStatus' }
    Pet:
      allOf:
        - $ref: '#/components/schemas/NewPet'
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid, readOnly: true }
